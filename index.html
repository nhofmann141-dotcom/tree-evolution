
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree Evolution</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101812;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:12px;left:10px;right:10px;display:flex;justify-content:space-around;gap:6px;z-index:5}
.stat{background:#17251de8;border:1px solid #526b50;border-radius:12px;padding:9px 12px;text-align:center;min-width:85px;box-shadow:0 4px 15px #0007}
.stat small{display:block;color:#a9c29e;font-size:11px}
.stat strong{font-size:17px}
.xpbox{position:absolute;top:83px;left:12%;width:76%;height:9px;background:#263328;border-radius:20px;overflow:hidden;z-index:5}
#xpbar{height:100%;width:0%;background:linear-gradient(90deg,#7da85b,#d0d78a);transition:width .3s}
#leveltext{position:absolute;top:98px;width:100%;text-align:center;font-size:12px;color:#d5e2cc;z-index:5}
.actions{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:9px;z-index:6;flex-wrap:wrap;padding:0 8px}
button{border:1px solid #728b64;background:#263d2c;color:white;border-radius:13px;padding:13px 17px;font-size:14px;font-weight:bold;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96);background:#45683e}
#water{background:#597d43;border-color:#9ab47a;padding:15px 24px;font-size:16px}
.panel{display:none;position:absolute;z-index:10;left:5%;right:5%;top:18%;max-height:65%;overflow:auto;background:#17251df5;border:1px solid #71866a;border-radius:18px;padding:18px;box-shadow:0 10px 40px #000b}
.panel h2{margin-top:0}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #405442;padding:12px 0}
.item button{padding:9px 12px}
#message{position:absolute;top:125px;left:0;right:0;text-align:center;color:#e4edcf;font-weight:bold;z-index:5;text-shadow:0 2px 5px black}
</style>
</head>
<body>
<div id="game"></div>

<div class="hud">
 <div class="stat"><small>🪙 MÜNZEN</small><strong id="coins">0</strong></div>
 <div class="stat"><small>⭐ LEVEL</small><strong id="level">1</strong></div>
 <div class="stat"><small>🌱 XP</small><strong id="xp">0/100</strong></div>
</div>
<div class="xpbox"><div id="xpbar"></div></div>
<div id="leveltext">Dein Baum entwickelt sich</div>
<div id="message">Dein Baum wartet auf Wasser 🌳</div>

<div class="actions">
 <button id="water">💧 Gießen</button>
 <button id="shopBtn">🛒 Shop</button>
 <button id="inventoryBtn">🎒 Inventar</button>
 <button id="treesBtn">🌳 Bäume</button>
</div>

<div class="panel" id="shop">
 <h2>🛒 Gießkannen-Shop</h2>
 <div id="shopItems"></div>
 <button onclick="closePanels()">Schließen</button>
</div>
<div class="panel" id="inventory">
 <h2>🎒 Dein Inventar</h2>
 <div id="inventoryItems"></div>
 <button onclick="closePanels()">Schließen</button>
</div>
<div class="panel" id="trees">
 <h2>🌳 Baum-Sammlung</h2>
 <div id="treeItems"></div>
 <button onclick="closePanels()">Schließen</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const container=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x111b18);
scene.fog=new THREE.Fog(0x111b18,12,28);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);
camera.position.set(0,5.2,10);
camera.lookAt(0,2,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc8dfc4,0x283522,2));
const moonLight=new THREE.DirectionalLight(0xe0edcf,2.2);
moonLight.position.set(-4,8,5);
moonLight.castShadow=true;
scene.add(moonLight);

const ground=new THREE.Mesh(
 new THREE.CircleGeometry(9,64),
 new THREE.MeshStandardMaterial({color:0x263d2b,roughness:1})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.08;
ground.receiveShadow=true;
scene.add(ground);

const island=new THREE.Mesh(
 new THREE.CylinderGeometry(5.5,5.9,.45,64),
 new THREE.MeshStandardMaterial({color:0x314b32,roughness:1})
);
island.position.y=-.32;
island.receiveShadow=true;
scene.add(island);

const moon=new THREE.Mesh(
 new THREE.SphereGeometry(.65,32,32),
 new THREE.MeshBasicMaterial({color:0xd8dfbd})
);
moon.position.set(-4.5,6,-5);
scene.add(moon);

for(let i=0;i<18;i++){
 const h=2+Math.random()*3;
 const tree=new THREE.Group();
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.12,.22,h,7),
  new THREE.MeshStandardMaterial({color:0x30251c})
 );
 trunk.position.y=h/2;
 tree.add(trunk);
 const leaves=new THREE.Mesh(
  new THREE.ConeGeometry(.9,h*.65,7),
  new THREE.MeshStandardMaterial({color:0x18291e})
 );
 leaves.position.y=h*.85;
 tree.add(leaves);
 const a=Math.random()*Math.PI*2;
 const r=7+Math.random()*3;
 tree.position.set(Math.cos(a)*r,0,Math.sin(a)*r-2);
 scene.add(tree);
}

const treeGroup=new THREE.Group();
scene.add(treeGroup);

const palettes=[
 [0x315b32,0x416b38],
 [0xd85c9c,0xf5a6d4],
 [0xe8d8a1,0xffffff],
 [0x5a1723,0x9d2635],
 [0x58d9e6,0xa9f8ff],
 [0xd5a52b,0xffdf76],
 [0x392c78,0x8069d8],
 [0x9bdcf0,0xe4faff],
 [0xe85b26,0xffa12e],
 [0x66d7a1,0xd0ff9c]
];
const treeNames=[
'Eichenbaum','Candy Tree','Engelbaum','Teufelsbaum',
'Kristallbaum','Goldbaum','Galaxy-Baum','Eisbaum',
'Feuerbaum','Regenbogenbaum'
];
const unlocks=[1,3,5,8,12,16,20,25,30,40];

let state={
 coins:0,level:1,xp:0,can:0,
 owned:[0]
};

try{
 const saved=localStorage.getItem('treeEvolutionSave');
 if(saved)state={...state,...JSON.parse(saved)};
}catch(e){}

function save(){
 try{localStorage.setItem('treeEvolutionSave',JSON.stringify(state))}catch(e){}
}

function makeTree(){
 while(treeGroup.children.length)treeGroup.remove(treeGroup.children[0]);

 const index=Math.max(0,unlocks.findLastIndex(n=>state.level>=n));
 const colors=palettes[index];
 const bark=new THREE.MeshStandardMaterial({color:0x503522,roughness:1});
 const leaves=[
  new THREE.MeshStandardMaterial({color:colors[0],roughness:.9}),
  new THREE.MeshStandardMaterial({color:colors[1],roughness:.9})
 ];

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.28,.48,2.5,12),
  bark
 );
 trunk.position.y=1.25;
 trunk.castShadow=true;
 treeGroup.add(trunk);

 for(let i=0;i<5;i++){
  const root=new THREE.Mesh(
   new THREE.CylinderGeometry(.04,.2,1,7),
   bark
  );
  root.position.set(Math.cos(i*1.25)*.43,.25,Math.sin(i*1.25)*.43);
  root.rotation.z=Math.cos(i*1.25)*.65;
  root.rotation.x=Math.sin(i*1.25)*.65;
  treeGroup.add(root);
 }

 for(let i=0;i<13;i++){
  const angle=i*2.4;
  const branch=new THREE.Mesh(
   new THREE.CylinderGeometry(.045,.12,1.2,7),
   bark
  );
  branch.position.set(Math.cos(angle)*.65,2+Math.random()*.7,Math.sin(angle)*.55);
  branch.rotation.z=Math.cos(angle)*-.7;
  branch.rotation.x=Math.sin(angle)*.7;
  treeGroup.add(branch);
 }

 for(let i=0;i<17;i++){
  const a=i*2.4;
  const r=.6+Math.random()*.55;
  const leaf=new THREE.Mesh(
   new THREE.IcosahedronGeometry(.75+Math.random()*.25,2),
   leaves[i%2]
  );
  leaf.position.set(Math.cos(a)*r,2.9+Math.random()*1.25,Math.sin(a)*r);
  leaf.scale.set(1.1,1,.95);
  leaf.castShadow=true;
  treeGroup.add(leaf);
 }

 treeGroup.scale.setScalar(.72+(state.xp/100)*.58);
 treeGroup.position.y=0;
}
makeTree();

const canGroup=new THREE.Group();
scene.add(canGroup);
const metal=new THREE.MeshStandardMaterial({color:0x9aaf91,metalness:.65,roughness:.3});
const darkMetal=new THREE.MeshStandardMaterial({color:0x536b58,metalness:.5,roughness:.4});

const body=new THREE.Mesh(new THREE.CylinderGeometry(.35,.42,.65,24),metal);
body.position.set(2.05,.65,0);
canGroup.add(body);

const top=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.1,24),darkMetal);
top.position.set(2.05,1.02,0);
canGroup.add(top);

const handle=new THREE.Mesh(new THREE.TorusGeometry(.35,.065,10,24,Math.PI),darkMetal);
handle.position.set(2.05,.85,0);
handle.rotation.z=Math.PI;
canGroup.add(handle);

const spout=new THREE.Mesh(new THREE.CylinderGeometry(.07,.12,.9,12),metal);
spout.position.set(2.7,.85,0);
spout.rotation.z=-1.05;
canGroup.add(spout);

const nozzle=new THREE.Mesh(new THREE.SphereGeometry(.15,16,12),darkMetal);
nozzle.position.set(3.08,1.2,0);
canGroup.add(nozzle);

const waterMaterial=new THREE.MeshStandardMaterial({
 color:0x63caff,transparent:true,opacity:.8,
 emissive:0x164d77
});
let waterLine=null;
let waterTimer=0;

function waterEffect(){
 if(waterLine)scene.remove(waterLine);
 const points=[
  new THREE.Vector3(3.08,1.2,0),
  new THREE.Vector3(2.4,.9,.1),
  new THREE.Vector3(1.3,.35,.1),
  new THREE.Vector3(.3,.08,.1)
 ];
 const curve=new THREE.CatmullRomCurve3(points);
 waterLine=new THREE.Mesh(
  new THREE.TubeGeometry(curve,24,.045,8,false),
  waterMaterial
 );
 scene.add(waterLine);
 waterTimer=1;
}

const cans=[
 {name:'Eichen-Kanne',price:0,power:10},
 {name:'Engel-Kanne',price:100,power:15},
 {name:'Teufel-Kanne',price:250,power:20},
 {name:'Candy-Kanne',price:500,power:25},
 {name:'Kristall-Kanne',price:1000,power:35},
 {name:'Gold-Kanne',price:2500,power:45},
 {name:'Galaxy-Kanne',price:5000,power:60},
 {name:'Drachen-Kanne',price:10000,power:80}
];

function updateUI(){
 document.getElementById('coins').textContent=state.coins;
 document.getElementById('level').textContent=state.level;
 document.getElementById('xp').textContent=state.xp+'/100';
 document.getElementById('xpbar').style.width=state.xp+'%';
 document.getElementById('leveltext').textContent='Level '+state.level+' · '+treeNames[Math.max(0,unlocks.findLastIndex(n=>state.level>=n))];
 save();
}
updateUI();

function waterTree(){
 const power=cans[state.can].power;
 state.xp+=power;
 state.coins+=5;
 while(state.xp>=100){
  state.xp-=100;
  state.level++;
  document.getElementById('message').textContent='🎉 Neues Level! Dein Baum beginnt von vorne!';
 }
 makeTree();
 waterEffect();
 updateUI();
}
document.getElementById('water').addEventListener('click',waterTree);

function closePanels(){
 document.querySelectorAll('.panel').forEach(p=>p.style.display='none');
}
window.closePanels=closePanels;

function showPanel(id){
 closePanels();
 document.getElementById(id).style.display='block';
}
document.getElementById('shopBtn').onclick=()=>{
 const el=document.getElementById('shopItems');
 el.innerHTML='';
 cans.forEach((c,i)=>{
  const owned=state.owned.includes(i);
  const div=document.createElement('div');
  div.className='item';
  div.innerHTML=`<div><b>${c.name}</b><br><small>${c.power} XP pro Gießen · ${c.price} Münzen</small></div>`;
  const btn=document.createElement('button');
  btn.textContent=owned?(state.can===i?'Ausgerüstet':'Ausrüsten'):'Kaufen';
  btn.onclick=()=>{
   if(owned){state.can=i;}
   else if(state.coins>=c.price){
    state.coins-=c.price;
    state.owned.push(i);
    state.can=i;
   }else{
    document.getElementById('message').textContent='Du hast noch nicht genug Münzen!';
    return;
   }
   updateUI();
   document.getElementById('shopBtn').click();
  };
  div.appendChild(btn);el.appendChild(div);
 });
 showPanel('shop');
};
document.getElementById('inventoryBtn').onclick=()=>{
 const el=document.getElementById('inventoryItems');
 el.innerHTML='';
 state.owned.forEach(i=>{
  const div=document.createElement('div');
  div.className='item';
  div.innerHTML=`<b>💧 ${cans[i].name}</b>`;
  const btn=document.createElement('button');
  btn.textContent=state.can===i?'Ausgerüstet':'Ausrüsten';
  btn.onclick=()=>{state.can=i;updateUI();document.getElementById('inventoryBtn').click()};
  div.appendChild(btn);el.appendChild(div);
 });
 showPanel('inventory');
};
document.getElementById('treesBtn').onclick=()=>{
 const el=document.getElementById('treeItems');
 el.innerHTML='';
 treeNames.forEach((name,i)=>{
  const unlocked=state.level>=unlocks[i];
  const div=document.createElement('div');
  div.className='item';
  div.innerHTML=`<b>${unlocked?'🌳':'🔒'} ${name}</b><span>Level ${unlocks[i]}</span>`;
  el.appendChild(div);
 });
 showPanel('trees');
};

function animate(){
 requestAnimationFrame(animate);
 if(waterTimer>0){
  waterTimer-=.025;
  if(waterLine)waterLine.visible=waterTimer>0;
 }
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
