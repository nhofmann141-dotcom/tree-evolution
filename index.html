
<!DOCTYPE html>
<html lang="de">
<head>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101711;color:#e8efdf;
 font-family:Arial,sans-serif;
}
header{
 height:70px;background:#17251b;border-bottom:1px solid #40543b;
 display:flex;justify-content:space-around;align-items:center;
 position:relative;z-index:2;
}
.stat{text-align:center;font-size:11px;color:#a9b9a9;font-weight:bold}
.stat span{display:block;font-size:17px;color:#e0e9cb;margin-top:5px}
main{max-width:720px;margin:auto;padding:12px}
h1{text-align:center;color:#d8e6c4;font-size:25px;letter-spacing:3px;margin:13px 0 5px}
.sub{text-align:center;color:#899b83;font-size:11px;letter-spacing:2px}
#game{

 border:1px solid #40533b;border-radius:18px;

}
#view{width:100%;height:100%;display:block;touch-action:none}
#treeLabel{

 pointer-events:none;
}
#levelLabel{
 position:absolute;bottom:13px;left:0;right:0;text-align:center;
 color:#e0e8d0;font-size:12px;text-shadow:0 2px 8px #000;
 pointer-events:none;
}
.progress{height:9px;background:#293b2c;border-radius:20px;margin:12px 2px;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,#668e49,#c4d68b);transition:width .2s}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
button{

 color:#e0ead8;padding:14px;font-weight:bold;font-size:14px;cursor:pointer;
}
button:active{transform:scale(.98)}
.water{
 grid-column:1/-1;background:#355c3c;border-color:#78966b;

}
.section{background:#18271c;border:1px solid #304532;border-radius:15px;padding:14px;margin-top:14px}
.section h2{font-size:16px;margin:0 0 10px;color:#d5e6c7}
#collection{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.treeCard{background:#243729;border:1px solid #3c5740;border-radius:10px;text-align:center;padding:10px;font-size:12px}
.treeCard b{display:block;font-size:23px;margin-bottom:4px}
.overlay{
 display:none;position:fixed;inset:0;background:#000c;z-index:10;
 align-items:center;justify-content:center;padding:12px;
}
.panel{
 width:100%;max-width:540px;max-height:88vh;overflow:auto;
 background:#17251b;border:1px solid #496348;border-radius:18px;padding:15px;
}
.paneltop{display:flex;justify-content:space-between;align-items:center}
.paneltop h2{font-size:19px}
.close{background:#3b2929;border-color:#694444}
.items{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.item{background:#223328;border:1px solid #405842;border-radius:12px;padding:12px;text-align:center}
.item .emoji{font-size:32px}
.item h3{font-size:14px;margin:6px}
.item p{font-size:12px;color:#a9bea5}
.item button{width:100%;padding:10px;background:#3d6542}
#toast{
 position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
 background:#304b34;color:white;padding:12px 18px;border-radius:25px;
 z-index:20;opacity:0;transition:.2s;pointer-events:none;
}
.hint{text-align:center;color:#80927c;font-size:11px;margin-top:9px}
</style>
</head>

<body>
<header>
 <div class="stat">🪙 MÜNZEN<span id="coins">100</span></div>
 <div class="stat">⭐ LEVEL<span id="level">1</span></div>
 <div class="stat">✨ XP<span id="xp">0</span></div>
</header>

<main>
<h1>TREE EVOLUTION</h1>
<div class="sub">GROW YOUR MAGICAL FOREST</div>

<div id="game">
 <div id="treeLabel">🌳 Eichenbaum</div>
 <canvas id="view"></canvas>
 <div id="levelLabel">LEVEL 1 • WACHSTUM 0%</div>
</div>
<div class="hint">Du kannst die Kamera mit deinem Finger drehen.</div>

<div class="progress"><div id="bar"></div></div>

<div class="buttons">
 <button class="water" onclick="waterTree()">💧 BAUM BEWÄSSERN</button>
 <button onclick="openPanel('shop')">🛒 SHOP</button>

<div class="section">
 <h2>🌲 DEINE BÄUME</h2>
 <div id="collection"></div>
</div>
</main>

<div class="overlay" id="shop">
 <div class="panel">
  <div class="paneltop">
   <h2>🛒 GIEẞKANNEN-SHOP</h2>
   <button class="close" onclick="closePanel('shop')">✕</button>
  </div>
  <p style="color:#a9bea5">Sammle seltene Gießkannen.</p>

 </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const trees=[
 {name:"Eichenbaum",emoji:"🌳",level:1,colors:[0x244b2b,0x365d32,0x183923]},
 {name:"Candy Tree",emoji:"🍬",level:3,colors:[0x9e477d,0xd26ba7,0x6b315c]},
 {name:"Engelbaum",emoji:"😇",level:5,colors:[0xb9a86c,0xe1d5a0,0x8c8152]},
 {name:"Teufelsbaum",emoji:"😈",level:8,colors:[0x822e2e,0xb33b32,0x511e25]},
 {name:"Kristallbaum",emoji:"💎",level:12,colors:[0x367f8b,0x59b8c4,0x24505e]},
 {name:"Goldbaum",emoji:"🌟",level:16,colors:[0xa17a30,0xd3ad50,0x76531d]},
 {name:"Galaxy-Baum",emoji:"🌌",level:20,colors:[0x49316e,0x7950a3,0x302044]},
 {name:"Eisbaum",emoji:"❄️",level:25,colors:[0x477e91,0x80b7c5,0x345566]},
 {name:"Feuerbaum",emoji:"🔥",level:30,colors:[0x8b3824,0xc75b29,0x63251e]},
 {name:"Regenbogenbaum",emoji:"🌈",level:40,colors:[0x86528b,0x5e78a5,0x416c68]}
];

const cans=[
 {id:0,name:"Alte Holzkanne",emoji:"🪣",price:0,power:1,color:0x705039},
 {id:1,name:"Mooskanne",emoji:"🌿",price:100,power:2,color:0x486a3b},
 {id:2,name:"Waldkanne",emoji:"🍃",price:250,power:3,color:0x315b32},
 {id:3,name:"Candy-Kanne",emoji:"🍬",price:500,power:5,color:0xc65c9a},
 {id:4,name:"Engelskanne",emoji:"😇",price:900,power:8,color:0xd8c88d},
 {id:5,name:"Teufelskanne",emoji:"😈",price:1400,power:11,color:0x9e302c},
 {id:6,name:"Kristallkanne",emoji:"💎",price:2200,power:15,color:0x4da9bc},
 {id:7,name:"Goldkanne",emoji:"🏆",price:3500,power:20,color:0xd2a63c},
 {id:8,name:"Galaxy-Kanne",emoji:"🌌",price:6000,power:28,color:0x72509e},
 {id:9,name:"Regenbogenkanne",emoji:"🌈",price:10000,power:40,color:0x8a75b8},
 {id:10,name:"Sternenkanne",emoji:"⭐",price:18000,power:60,color:0xd8d5a1},
 {id:11,name:"Drachenkanne",emoji:"🐉",price:30000,power:90,color:0x47774d}
];

let state={coins:100,xp:0,level:1,growth:0,owned:[0],equipped:0};
try{
 const saved=JSON.parse(localStorage.getItem("treeEvolutionDark"));
 if(saved)state={...state,...saved};
}catch(e){}

let scene,camera,renderer,treeGroup,canGroup;
let waterParticles=[];
let watering=false,angle=0,height=4.5;
let dragging=false,lastX=0,lastY=0;
const canvas=document.getElementById("view");

function mat(color,roughness=.85){
 return new THREE.MeshStandardMaterial({color,roughness});
}
function addSphere(parent,pos,scale,material,detail=2){
 const mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(1,detail),material);
 mesh.position.set(...pos);
 mesh.scale.set(...scale);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}
function addBranch(parent,points,radius,material){
 const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
 const mesh=new THREE.Mesh(
  new THREE.TubeGeometry(curve,20,radius,8,false),material
 );
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}
function betweenCylinder(parent,a,b,radius,material){
 const start=new THREE.Vector3(...a);
 const end=new THREE.Vector3(...b);
 const direction=new THREE.Vector3().subVectors(end,start);
 const mesh=new THREE.Mesh(
  new THREE.CylinderGeometry(radius*.7,radius,direction.length(),10),material
 );
 mesh.position.copy(start).add(end).multiplyScalar(.5);
 mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction.normalize());
 mesh.castShadow=true;
 parent.add(mesh);
 return mesh;
}

/* BAUM */
function makeTree(){
 treeGroup=new THREE.Group();
 scene.add(treeGroup);

 const type=[...trees].reverse().find(t=>state.level>=t.level)||trees[0];
 const leaves=type.colors.map(c=>mat(c));
 const bark=mat(0x493021);
 const barkLight=mat(0x65442e);
 const darkBark=mat(0x302016);

 // Breiter, leicht geschwungener Hauptstamm
 addBranch(treeGroup,[
  [0,0,0],[.02,.7,0],[-.06,1.5,.02],[.04,2.2,0],[0,2.9,0]
 ],.24,bark);

 // Wurzeln
 for(let i=0;i<7;i++){
  const a=i*Math.PI*2/7;
  const x=Math.cos(a),z=Math.sin(a);
  addBranch(treeGroup,[
   [0,.38,0],[x*.28,.18,z*.28],[x*.65,.04,z*.65],[x*.9,.03,z*.9]
  ],.09,barkLight);
 }

 // Große Äste
 const branches=[
  [[0,1.5,0],[-.35,2,.05],[-.85,2.6,.1],[-1.15,3,.1]],
  [[0,1.8,0],[.35,2.3,0],[.8,2.8,.1],[1.2,3.1,.1]],
  [[0,2.1,0],[.05,2.7,-.3],[-.3,3.2,-.45],[-.55,3.5,-.5]],
  [[0,2.2,0],[.15,2.8,.3],[.55,3.3,.45],[.8,3.6,.5]],
  [[0,2.5,0],[-.1,3.1,0],[-.15,3.7,0],[.05,4.1,0]],
  [[0,1.7,0],[-.2,2.1,-.4],[-.5,2.6,-.7],[-.8,2.8,-.8]]
 ];
 branches.forEach((p,i)=>addBranch(treeGroup,p,.11-(i*.008),barkLight));

 // Kleine Seitenäste
 for(let i=0;i<14;i++){
  const a=i*2.4;
  const x=Math.cos(a),z=Math.sin(a);
  const y=2.5+(i%4)*.35;
  addBranch(treeGroup,[
   [x*.25,y-.35,z*.25],
   [x*.55,y,z*.55],
   [x*.85,y+.3,z*.85]
  ],.045,bark);
 }

 // Rindenstruktur
 for(let i=0;i<10;i++){
  const a=i*2.4;
  const y=.5+(i%5)*.35;
  addBranch(treeGroup,[
   [Math.cos(a)*.19,y,Math.sin(a)*.19],
   [Math.cos(a)*.24,y+.22,Math.sin(a)*.24]
  ],.018,darkBark);
 }

 // Unregelmäßige große Blattgruppen
 const clusters=[
  [0,3.45,0,1.05,1.0,.9],
  [-.85,3.15,.05,.75,.8,.7],
  [.82,3.25,.1,.8,.82,.75],
  [-.55,3.8,.45,.72,.75,.7],
  [.58,3.9,-.35,.76,.8,.7],
  [0,4.35,0,.75,.72,.72],
  [-1.15,3.6,-.25,.52,.6,.55],
  [1.15,3.65,.25,.55,.6,.55],
  [-.35,2.9,.65,.6,.58,.6],
  [.48,2.95,.55,.62,.65,.58],
  [-.55,4.15,-.45,.5,.57,.5],
  [.6,4.2,.4,.53,.55,.5]
 ];
 clusters.forEach((p,i)=>{
  addSphere(treeGroup,p.slice(0,3),p.slice(3),leaves[i%3],2);
 });

 // Zusätzliche kleine Blätter für mehr Volumen
 for(let i=0;i<34;i++){
  const a=i*2.399;
  const r=.45+(i%5)*.17;
  const y=2.9+(i%7)*.19;
  addSphere(
   treeGroup,
   [Math.cos(a)*r,y,Math.sin(a)*r],
   [.22,.2,.22],
   leaves[i%3],1
  );
 }

 // Dezente Lichtpunkte an besonderen Bäumen
 if(state.level>=5){
  const ring=new THREE.Mesh(
   new THREE.TorusGeometry(1.35,.025,8,64),
   new THREE.MeshStandardMaterial({color:0xc9b77b,emissive:0x554322})
  );
  ring.position.y=4.85;
  treeGroup.add(ring);
 }
 if(state.level>=8){
  for(let i=0;i<2;i++){
   const horn=new THREE.Mesh(
    new THREE.ConeGeometry(.14,.5,10),
    mat(0x291b1b)
   );
   horn.position.set(i?-.65:.65,4.45,0);
   horn.rotation.z=i?-.4:.4;
   treeGroup.add(horn);
  }
 }

 // Jedes Level beginnt wieder klein und wächst bis zum nächsten Level.
 treeGroup.scale.setScalar(.72+(state.xp/100)*.58);
}

/* REALISTISCHERE GIESSKANNE */
function makeCan(){
 canGroup=new THREE.Group();
 scene.add(canGroup);

 const c=cans.find(v=>v.id===state.equipped)||cans[0];
 const metal=new THREE.MeshStandardMaterial({
  color:c.color,metalness:.45,roughness:.3
 });
 const dark=mat(0x302b23,.5);
 const silver=new THREE.MeshStandardMaterial({
  color:0x8e9b8a,metalness:.7,roughness:.25
 });

 // Runder Kannen-Körper
 const profile=[
  new THREE.Vector2(0,0),
  new THREE.Vector2(.2,.02),
  new THREE.Vector2(.32,.12),
  new THREE.Vector2(.34,.48),
  new THREE.Vector2(.28,.65),
  new THREE.Vector2(.12,.7),
  new THREE.Vector2(0,.7)
 ];
 const body=new THREE.Mesh(new THREE.LatheGeometry(profile,32),metal);
 body.position.set(0,.08,0);
 body.castShadow=true;
 canGroup.add(body);

 // Deckel
 const lid=new THREE.Mesh(
  new THREE.CylinderGeometry(.14,.14,.07,24),dark
 );
 lid.position.set(0,.8,0);
 canGroup.add(lid);

 const knob=new THREE.Mesh(
  new THREE.SphereGeometry(.07,16,12),metal
 );
 knob.position.set(0,.87,0);
 canGroup.add(knob);

 // Griff
 const handleCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(-.23,.68,0),
  new THREE.Vector3(-.55,.83,0),
  new THREE.Vector3(-.68,.55,0),
  new THREE.Vector3(-.55,.25,0),
  new THREE.Vector3(-.24,.25,0)
 ]);
 const handle=new THREE.Mesh(
  new THREE.TubeGeometry(handleCurve,32,.055,10,false),dark
 );
 canGroup.add(handle);

 // Langer gebogener Ausguss Richtung Baum
 const spoutCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(.23,.52,0),
  new THREE.Vector3(.48,.62,0),
  new THREE.Vector3(.75,.77,0),
  new THREE.Vector3(.95,.82,0)
 ]);
 const spout=new THREE.Mesh(
  new THREE.TubeGeometry(spoutCurve,24,.09,12,false),metal
 );
 spout.castShadow=true;
 canGroup.add(spout);

 // Brausekopf am Ende
 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.13,16,12),metal
 );
 head.position.set(.95,.82,0);
 head.scale.set(1,.55,1);
 canGroup.add(head);

 const nozzle=new THREE.Mesh(
  new THREE.CylinderGeometry(.11,.09,.06,20),silver
 );
 nozzle.rotation.z=-Math.PI/2;
 nozzle.position.set(1.04,.82,0);
 canGroup.add(nozzle);

 // Kleine Löcher an der Brause
 for(let i=0;i<7;i++){
  const a=i*Math.PI*2/7;
  const dot=new THREE.Mesh(
   new THREE.SphereGeometry(.018,8,8),
   dark
  );
  dot.position.set(1.075,.82+Math.cos(a)*.065,Math.sin(a)*.065);
  canGroup.add(dot);
 }

 canGroup.position.set(2.0,.12,.15);
 canGroup.rotation.y=-.3;
}

/* HINTERGRUND */
function makeBackground(){
 // Himmel
 const sky=new THREE.Mesh(
  new THREE.SphereGeometry(70,32,24),
  new THREE.MeshBasicMaterial({color:0x101d29,side:THREE.BackSide})
 );
 scene.add(sky);

 // Mond
 const moon=new THREE.Mesh(
  new THREE.SphereGeometry(1.0,32,24),
  new THREE.MeshBasicMaterial({color:0xd6ddc4})
 );
 moon.position.set(-7,8,-15);
 scene.add(moon);

 const moonLight=new THREE.PointLight(0x9db9c2,45,35);
 moonLight.position.set(-7,8,-12);
 scene.add(moonLight);

 // Sterne
 const starMat=new THREE.MeshBasicMaterial({color:0xcbd5bb});
 for(let i=0;i<100;i++){
  const star=new THREE.Mesh(
   new THREE.SphereGeometry(.025+Math.random()*.025,6,6),starMat
  );
  star.position.set(
   (Math.random()-.5)*35,
   5+Math.random()*15,
   -12-Math.random()*15
  );
  scene.add(star);
 }

 // Berge im Hintergrund
 for(let i=0;i<9;i++){
  const mountain=new THREE.Mesh(
   new THREE.ConeGeometry(2.5+Math.random()*2,5+Math.random()*4,5),
   mat(i%2?0x1c302d:0x24352f)
  );
  mountain.position.set(-16+i*4,1.2,-13-Math.random()*4);
  scene.add(mountain);
 }

 // Dunkle Hintergrundbäume
 for(let i=0;i<24;i++){
  const x=(Math.random()-.5)*25;
  const z=-5-Math.random()*10;
  const h=2.5+Math.random()*2;
  const trunk=new THREE.Mesh(
   new THREE.CylinderGeometry(.12,.2,h,7),
   mat(0x30251d)
  );
  trunk.position.set(x,h/2-.1,z);
  scene.add(trunk);

  for(let j=0;j<3;j++){
   const top=new THREE.Mesh(
    new THREE.ConeGeometry(.9-j*.16,1.8,7),
    mat(j%2?0x1b3528:0x243e2d)
   );
   top.position.set(x,h*.55+j*.65,z);
   scene.add(top);
  }
 }

 // Bodennebel
 const fogLight=new THREE.PointLight(0x294c3b,10,18);
 fogLight.position.set(-3,1,-4);
 scene.add(fogLight);
}

/* WASSERSTRAHL */
let stream=null;
let streamGlow=null;

function makeWaterStream(){
 const waterMat=new THREE.MeshBasicMaterial({
  color:0x65c9ed,transparent:true,opacity:.85
 });
 const glowMat=new THREE.MeshBasicMaterial({
  color:0x9deaff,transparent:true,opacity:.2
 });

 // Der Strahl geht vom Ausguss der Kanne zum Baum.
 const curve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(3.04,1.0,.15),
  new THREE.Vector3(2.4,.85,.12),
  new THREE.Vector3(1.4,.5,.08),
  new THREE.Vector3(.35,.18,.02)
 ]);

 stream=new THREE.Mesh(
  new THREE.TubeGeometry(curve,30,.035,8,false),waterMat
 );
 streamGlow=new THREE.Mesh(
  new THREE.TubeGeometry(curve,30,.085,8,false),glowMat
 );
 stream.visible=false;
 streamGlow.visible=false;
 scene.add(streamGlow);
 scene.add(stream);
}

function makeDrop(){
 const drop=new THREE.Mesh(
  new THREE.SphereGeometry(.045,10,8),
  new THREE.MeshBasicMaterial({color:0x7bd9ff})
 );
 drop.position.set(3.04,1,.15);
 scene.add(drop);

 waterParticles.push({
  mesh:drop,
  progress:0,
  start:new THREE.Vector3(3.04,1,.15),
  end:new THREE.Vector3(.35,.18,.02),
  arc:.45+Math.random()*.3
 });
}

function waterEffect(){
 watering=true;
 stream.visible=true;
 streamGlow.visible=true;

 for(let i=0;i<20;i++){
  setTimeout(()=>makeDrop(),i*35);
 }

 setTimeout(()=>{
  watering=false;
  if(stream)stream.visible=false;
  if(streamGlow)streamGlow.visible=false;
 },1000);
}

/* SPIEL */
function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x101d29);
 scene.fog=new THREE.FogExp2(0x17251e,.025);

 camera=new THREE.PerspectiveCamera(43,1,.1,100);

 renderer=new THREE.WebGLRenderer({canvas,antialias:true});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;

 scene.add(new THREE.HemisphereLight(0xa9b9ad,0x18231a,1.5));

 const light=new THREE.DirectionalLight(0xd6e4c4,2.4);
 light.position.set(-5,10,6);
 light.castShadow=true;
 light.shadow.mapSize.set(1024,1024);
 scene.add(light);

 makeBackground();

 // Waldboden
 const ground=new THREE.Mesh(
  new THREE.CircleGeometry(40,64),
  mat(0x1d3022)
 );
 ground.rotation.x=-Math.PI/2;
 ground.position.y=-.45;
 ground.receiveShadow=true;
 scene.add(ground);

 // Runde Insel
 const island=new THREE.Mesh(
  new THREE.CylinderGeometry(5,5.2,.55,64),
  mat(0x30452d)
 );
 island.position.y=-.28;
 island.receiveShadow=true;
 island.castShadow=true;
 scene.add(island);

 // Grasbüschel
 for(let i=0;i<100;i++){
  const a=Math.random()*Math.PI*2;
  const r=1+Math.random()*4.5;
  const blade=new THREE.Mesh(

   waterParticles.splice(i,1);

 }

 renderer.render(scene,camera);
